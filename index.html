<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bioskop Ana</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#05050a;--cd:#0c0b16;--ln:#201d36;--tx:#f4f3fc;--mu:#9b98b8;--g:linear-gradient(135deg,#8b5cf6,#3b82f6)}
html{background:var(--bg)}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:88px;background:radial-gradient(700px 360px at 0 -40px,#8b5cf64d,transparent 70%),radial-gradient(600px 340px at 100% 0,#3b82f63d,transparent 70%),var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
select option{color:#000}
.hd{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#05050acc;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo.big{font-size:30px;text-align:center}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--mu)}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g);font-weight:700;color:#fff}
main{max-width:760px;margin:auto;padding:18px}
h2{font-size:17px;margin:26px 0 12px}
h1{letter-spacing:-.02em}
.mu{color:var(--mu)}.mt{margin-top:16px}
.back{display:inline-flex;gap:10px;align-items:center;color:var(--mu);font-weight:600;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.po{position:relative;aspect-ratio:3/4;border-radius:18px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,hsl(var(--h) 70% 40%),hsl(calc(var(--h) + 45) 75% 13%));border:1px solid #ffffff14;overflow:hidden}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.po:has(img[src]):after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#05050add)}
.po b{position:relative;z-index:1;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tg{position:absolute;z-index:2;top:10px;left:10px;padding:2px 10px;border-radius:8px;background:#000a;font:700 11px "JetBrains Mono",monospace;color:#c4b5fd}
.cd small{display:block;margin-top:6px;color:var(--mu)}
.list{display:grid;gap:10px}
.hi{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--ln);background:var(--cd);border-radius:18px}
.po.s{width:64px;height:84px;flex:none;border-radius:12px}
.hm{flex:1;min-width:0;display:grid;gap:4px}
.hm b{font-size:14px;line-height:1.3}.hm small{color:var(--mu)}
.pg{height:4px;border-radius:4px;background:#ffffff1a;overflow:hidden}
.pg i{display:block;height:100%;background:var(--g)}
.dt{display:grid;gap:18px}
.dt .po{max-width:200px}
.dt h1{font-size:24px;line-height:1.25;margin-bottom:8px}
@media(min-width:560px){.dt{grid-template-columns:200px 1fr}}
.eps{display:flex;flex-wrap:wrap;gap:10px}
.in{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:#ffffff08;outline:0}
.in:focus{border-color:#8b5cf6}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:24px;overflow:hidden;border:1px solid var(--ln)}
.pl:fullscreen{border-radius:0;aspect-ratio:auto}
.pl video{width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute;left:0;right:0;padding:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.ui .ov{opacity:1;pointer-events:auto}
.ov.t{top:0;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(#000c,transparent);padding-bottom:30px}
.ov.t .ib{background:#0008;color:#fff;flex:none}
.tt{display:grid;gap:2px;min-width:0}.tt b{font-size:14px}.tt small{color:#ffffffb3}
.ov.b{bottom:0;padding-top:34px;background:linear-gradient(transparent,#000d)}
.tm{display:flex;align-items:center;gap:10px}
.tm b{font:500 12px "JetBrains Mono",monospace;color:#ffffffcc}
.ct{display:flex;align-items:center;gap:4px;margin-top:2px}
.ct button{display:grid;place-items:center;width:40px;height:40px;color:#fff}
.ct #sp{margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;outline:0;background:linear-gradient(90deg,#a78bfa,#60a5fa) 0 0/var(--v,0%) 100% no-repeat,#ffffff33}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
#vo{flex:none;width:65px}
.buf{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.buf.on{display:grid}
.buf div{padding:9px 16px;border-radius:99px;background:#0b0a14cc;border:1px solid #ffffff1f;font-size:13px}
.info{margin-top:18px;border:1px solid var(--ln);background:var(--cd);border-radius:28px;padding:24px 20px}
.lb{font:700 13px "JetBrains Mono",monospace;letter-spacing:.15em;color:#a78bfa}
.info h1{font-size:26px;margin:12px 0}
.eb{display:inline-block;padding:6px 14px;border-radius:10px;border:1px solid #6d4fd1;background:#8b5cf622;color:#c4b5fd;font:700 14px "JetBrains Mono",monospace}
.btns{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.b2{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--ln);border-radius:16px;background:#ffffff08;font-weight:600}
.b2.on{background:var(--g);border-color:transparent;color:#fff}
.b1{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:18px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:#08070ff2;backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.nv a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.nv a.on{color:#a78bfa}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:min(400px,100%);display:grid;gap:12px;padding:28px 24px;border:1px solid var(--ln);background:#0c0b16e6;border-radius:28px}
.seg{display:flex;padding:4px;border-radius:14px;background:#ffffff0d;margin:4px 0}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg .on{background:var(--g);color:#fff}
.er{min-height:20px;color:#fca5a5;font-size:13px}
#ts{position:fixed;left:50%;bottom:98px;z-index:60;transform:translate(-50%,12px);opacity:0;transition:.2s;pointer-events:none;padding:10px 18px;border-radius:99px;background:#17142b;border:1px solid #3b2f7a;font-size:13px;text-align:center;max-width:90vw}
#ts.on{opacity:1;transform:translate(-50%,0)}
.status{padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--mu);font-size:13px}
.room{margin-top:14px;border:1px solid var(--ln);background:var(--cd);border-radius:22px;padding:16px}
.rc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc b.code{font:700 20px "JetBrains Mono",monospace;letter-spacing:.2em;color:#c4b5fd}
.cm{display:flex;flex-direction:column;gap:8px;height:260px;overflow:auto;margin:12px 0}
.msg{word-break:break-word;font-size:14px}.msg b{color:#a78bfa}.msg.sys{color:var(--mu);font-size:12px}
.cin{display:flex;gap:8px}
.md{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:16px}
.md>div{width:min(520px,100%);max-height:92vh;overflow:auto;display:grid;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:24px;padding:22px}
.row{display:flex;gap:6px}.row .in{padding:10px}.row select{width:100px}
.fl{display:none;position:absolute;right:12px;top:64px;width:min(62%,330px);flex-direction:column;gap:6px;pointer-events:none;z-index:3}
.pl:fullscreen .fl{display:flex}
.fx{align-self:flex-end;max-width:100%;background:#0b0a14bf;backdrop-filter:blur(6px);border:1px solid #ffffff1a;padding:7px 12px;border-radius:14px;font-size:14px;word-break:break-word;animation:fin .3s,fout .6s 8.4s forwards}
.fx b{color:#c4b5fd}.fx.sys{color:#ffffffaa;font-size:12px}
@keyframes fin{from{opacity:0;transform:translateX(24px)}}
@keyframes fout{to{opacity:0}}
.rp{display:none;position:absolute;right:12px;bottom:96px;width:min(70%,360px);gap:6px;z-index:4}
.pl:fullscreen .rp.on{display:flex}
.rp .in{padding:10px 14px;background:#0b0a14d9}
#ctg{display:none!important}
.pl.rm:fullscreen #ctg{display:grid!important}
.et{position:relative;width:120px;aspect-ratio:16/10;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 60% 35%),#0c0b16)}
.et img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.et:after{content:"▶";position:absolute;z-index:1;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:#0009;display:grid;place-items:center;font-size:11px;color:#fff;padding-left:2px}
.en{position:absolute;z-index:2;left:6px;bottom:6px;padding:1px 8px;border-radius:7px;background:#000b;font:700 11px "JetBrains Mono",monospace;color:#fff}
.eps .b2.on{border-color:transparent}
/* tampilan serial */
.sh{display:grid;justify-items:center;text-align:center;gap:10px;padding-bottom:6px}
.sh .po{width:170px;aspect-ratio:2/3;box-shadow:0 18px 60px -12px #8b5cf6aa}
.sh h1{font-size:26px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:#ffffff0a;font:600 12px Inter,sans-serif}
.syn{text-align:left;width:100%;border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:16px}
.syn h3{font-size:14px;margin-bottom:6px}.syn p{color:var(--mu);font-size:14px;line-height:1.6}
.sh .b1{max-width:420px}
.pcard{margin-top:14px;border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:14px 16px;display:grid;gap:8px}
.pcard small{color:var(--mu)}
.rr{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.rr .cd{width:128px;flex:none}
.tb{display:flex;gap:8px}
.du{position:absolute;z-index:2;right:6px;bottom:6px;padding:1px 8px;border-radius:7px;background:#000b;font:700 11px "JetBrains Mono",monospace;color:#fff}
.du:empty{display:none}
.hi .ib[data-dl]{background:#8b5cf626;color:#a78bfa;border-radius:12px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const SB_URL='https://pdmrafvzkcopfpfwwizi.supabase.co';
const SB_KEY='sb_publishable_U4IdMzfQwUCgIGOOXuctzw_HEtvvFqY';
// Akun admin (tidak disimpan di database). Ganti sandinya di sini.
const ADMIN_USER='admin',ADMIN_PASS='admin123';
// Poster film diambil otomatis dari TMDB berdasarkan judul.
const TMDB_KEY='259658c16b4e90de382d7077b44ce297';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const I={chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',dl:'<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',play:'<path d="M7 4v16l13-8z" fill="currentColor"/>',pause:'<path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/>',rw:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',fw:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6m0-6-5 6"/>',gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M17 5a3.5 3.5 0 0 1 0 6.5M21.5 20c0-3-1.5-4.8-4-5.5"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ft=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let tmr;function toast(m){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';document.body.append(e)}e.textContent=m;e.className='on';clearTimeout(tmr);tmr=setTimeout(()=>e.className='',3000)}
const api=(p,o={})=>fetch(SB_URL+'/rest/v1/'+p,{...o,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',...o.headers}});
const rpc=(f,b)=>api('rpc/'+f,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
const resNum=r=>r==='4K'?2160:parseInt(r,10)||0;
const RES=['360p','480p','720p','1080p','1440p','4K'];

let catalog=[],cur=null,mode='in',S={q:''},hist=[];
const isS=a=>!!(a.episodes&&a.episodes.length);
const qualsOf=a=>[...new Set((isS(a)?a.episodes.flatMap(e=>e.sources):a.sources).map(x=>x.res||'Auto'))].sort((x,y)=>resNum(x)-resNum(y));
const wl=(a,ep)=>'#/watch/'+encodeURIComponent(a.id)+(ep?'/auto/'+ep:'');
function normalize(r){
 const ok=x=>x&&/^https?:\/\//i.test(x.url||''),ss=a=>(Array.isArray(a)?a:[]).filter(ok).sort((a,b)=>resNum(a.res)-resNum(b.res));
 const episodes=(Array.isArray(r.episodes)?r.episodes:[]).map(e=>({no:Number(e.no),title:e.title||'',thumb:e.thumb||'',sources:ss(e.sources)})).filter(e=>Number.isFinite(e.no)&&e.sources.length).sort((a,b)=>a.no-b.no);
 return{...r,title:r.title||'Tanpa judul',sources:ss(r.sources),episodes}
}
async function loadCatalog(){
 $('#app').innerHTML='<div class="lg"><div class="lc"><div class="logo big">Bioskop <span>Ana</span></div><p class="mu">Menghubungkan ke database…</p></div></div>';
 try{const r=await api('films?select=id,title,sources,episodes,created_at&order=created_at.desc');if(!r.ok)throw Error(await r.text()||'HTTP '+r.status);
  catalog=(await r.json()).map(normalize).filter(f=>f.sources.length||f.episodes.length);render()
 }catch(e){$('#app').innerHTML=`<main><div class="logo big">Bioskop <span>Ana</span></div><div class="status mt">Gagal mengambil data.<br><br>${esc(e.message)}</div><button class="b1 mt" onclick="loadCatalog()">Coba lagi</button></main>`}
}
async function loadHist(){
 if(!user())return;
 try{const r=await api('watch_history?select=film_id,episode,position,duration,updated_at&username=eq.'+encodeURIComponent(user())+'&order=updated_at.desc');
  if(r.ok)hist=(await r.json()).map(x=>({id:x.film_id,ep:x.episode||0,t:x.position,d:x.duration})).filter(x=>catalog.some(a=>a.id===x.id))}catch{}
}

/* ===== akun ===== */
const user=()=>ls.get('bs:s',null);
const isAdmin=()=>user()===ADMIN_USER;
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bioskop-ana:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const loginHtml=()=>`<div class="lg"><form id="lf" class="lc"><div class="logo big">Bioskop <span>Ana</span></div><p class="mu" style="text-align:center">Masuk untuk nonton film dan nobar bareng teman.</p>
<div class="seg"><button type="button" data-m="in" class="${mode==='in'?'on':''}">Masuk</button><button type="button" data-m="reg" class="${mode==='reg'?'on':''}">Daftar</button></div>
<input class="in" id="lu" placeholder="Username" required><input class="in" id="lp" type="password" placeholder="Kata sandi" required><div id="le" class="er"></div><button class="b1">${mode==='in'?'Masuk':'Buat akun'}</button></form></div>`;
function bindLogin(){
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
 $('#lf').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn&&(btn.disabled=true);const err=await auth(mode,$('#lu').value,$('#lp').value);btn&&(btn.disabled=false);if(err)$('#le').textContent=err}
}
async function auth(m,u,p){
 u=u.trim();
 if(!/^[\w.]{3,20}$/.test(u))return'Username 3–20 karakter: huruf, angka, titik, atau garis bawah.';
 if(p.length<6)return'Kata sandi minimal 6 karakter.';
 if(u.toLowerCase()===ADMIN_USER){
  if(m==='reg')return'Username sudah dipakai.';
  if(p!==ADMIN_PASS)return'Username atau kata sandi salah.';
  ls.set('bs:s',ADMIN_USER);await render();return resumeHost()
 }
 const h=await hash(p);
 try{
  const ok=await rpc(m==='reg'?'register_user':'login_user',{u,h});
  if(ok!==true)return m==='reg'?'Username sudah dipakai.':'Username atau kata sandi salah.';
 }catch{return'Gagal terhubung ke database.'}
 ls.set('bs:s',u.toLowerCase());await render();resumeHost()
}

/* ===== tampilan ===== */
const hue=s=>[...s].reduce((n,c)=>(n*31+c.charCodeAt(0))&65535,7)%360;
const card=a=>`<a class="cd" href="#/film/${encodeURIComponent(a.id)}"><div class="po" style="--h:${hue(a.title)}"><img data-t="${esc(a.title)}" data-k="${isS(a)?'tv':''}" alt="" onerror="this.remove()"><span class="tg">${isS(a)?a.episodes.length+' episode':a.sources.length+' kualitas'}</span><b>${esc(a.title)}</b></div><small>${qualsOf(a).map(esc).join(' • ')}</small></a>`;
const histCard=x=>{const a=catalog.find(z=>z.id===x.id);if(!a)return'';const p=x.d?Math.min(100,x.t/x.d*100):0;
 return`<a class="hi" href="${wl(a,x.ep)}"><div class="po s" style="--h:${hue(a.title)}"><img data-t="${esc(a.title)}" data-k="${isS(a)?'tv':''}" alt=""></div><div class="hm"><b>${esc(a.title)}${x.ep?' · Ep '+x.ep:''}</b><small>${ft(x.t)} / ${ft(x.d)}</small><div class="pg"><i style="width:${p}%"></i></div></div></a>`};
function detail(a){return`<a class="back" href="#/">${ic('back',20)}Beranda</a><div class="dt"><div class="po" style="--h:${hue(a.title)}"><img data-t="${esc(a.title)}" data-k="${isS(a)?'tv':''}" alt=""></div><div><h1>${esc(a.title)}</h1><p class="mu">Pilih kualitas video untuk mulai menonton.</p><div class="eps mt">${a.sources.map((s,i)=>`<a class="b2" href="#/watch/${encodeURIComponent(a.id)}/${i}">${esc(s.res||'Putar')}</a>`).join('')}</div>${isAdmin()?`<button class="b2 mt" data-edit="${esc(a.id)}">Edit film</button>`:''}</div></div>`}

let ES={q:'',asc:false,n:8};
function resumeTarget(a){const h=hist.find(x=>x.id===a.id&&x.ep),E=a.episodes;if(!h)return E[0].no;
 if(h.d&&h.t/h.d>.95){const nx=E.find(e=>e.no>h.ep);return nx?nx.no:h.ep}return h.ep}

/* durasi episode: diambil dari metadata video (2 sekaligus), disimpan di cache */
const dq=[];let dbusy=0;
const setDur=(el,d)=>{if(el.isConnected)el.textContent=Math.max(1,Math.round(d/60))+'m'};
function probe(el,url){
 const k='bs:dur:'+url,c=ls.get(k,0);if(c)return setDur(el,c);
 dq.push({el,url,k});pump()
}
function pump(){
 if(dbusy>=2||!dq.length)return;dbusy++;
 const j=dq.shift(),v=document.createElement('video');let done=0;
 v.preload='metadata';
 const end=()=>{if(done)return;done=1;clearTimeout(t);v.onloadedmetadata=v.onerror=null;v.removeAttribute('src');dbusy--;pump()};
 const t=setTimeout(end,15000);
 v.onloadedmetadata=()=>{if(isFinite(v.duration)){ls.set(j.k,v.duration);setDur(j.el,v.duration)}end()};
 v.onerror=end;v.src=j.url
}
/* sinopsis, rating, tahun dari TMDB */
async function loadMeta(a){
 const k='bs:m:'+a.title.toLowerCase();let m=ls.get(k,null);
 if(!m){
  const q=a.title.replace(/\(.*?\)/g,'').trim();
  try{
   for(const l of['id-ID','en-US']){
    const r=await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&language=${l}&query=${encodeURIComponent(q)}`);
    if(!r.ok)break;const h=((await r.json()).results||[])[0];if(!h)break;
    m={o:h.overview||'',r:h.vote_average||0,y:(h.first_air_date||'').slice(0,4)};if(m.o)break
   }
  }catch{}
  if(m)ls.set(k,m)
 }
 const s=$('#syn'),c=$('#chips');if(!m||!s||!c)return;
 if(m.r>0)c.insertAdjacentHTML('beforeend',`<span class="chip">★ ${m.r.toFixed(1)}</span>`);
 if(m.y)c.insertAdjacentHTML('beforeend',`<span class="chip">${esc(m.y)}</span>`);
 if(m.o){s.querySelector('p').textContent=m.o;s.hidden=false}
}

function saveNow(){
 if(!cur||!user())return;const{a,v,ep}=cur;if(!isFinite(v.duration)||!v.duration)return;
 const row={username:user(),film_id:a.id,position:v.currentTime,duration:v.duration,res:null,episode:ep||0,updated_at:new Date().toISOString()};
 const i=hist.findIndex(x=>x.id===a.id&&x.ep===(ep||0));if(i>=0)hist.splice(i,1);hist.unshift({id:a.id,ep:ep||0,t:row.position,d:row.duration});
 api('watch_history?on_conflict=username,film_id,episode',{method:'POST',keepalive:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)}).catch(()=>{});
}
async function download(a,i,ep){
 const E=ep?a.episodes.find(e=>e.no===ep):null,s=(E?E.sources:a.sources)[i];if(!s)return;
 const d=ls.get('bs:d:'+user(),[]).filter(x=>!(x.id===a.id&&x.index===i&&(x.ep||0)===(ep||0)));d.unshift({id:a.id,index:i,ep:ep||0,res:s.res});ls.set('bs:d:'+user(),d);
 const name=(a.title+(ep?' Ep '+ep:'')+' '+(s.res||'video')+'.mp4').replace(/[^\w .-]/g,'');
 try{const r=await fetch(s.url);if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob()),l=document.createElement('a');l.href=u;l.download=name;l.click();URL.revokeObjectURL(u);toast('Unduhan dimulai')}
 catch{const l=document.createElement('a');l.href=s.url;l.target='_blank';l.rel='noopener';l.click();toast('Link video dibuka. Gunakan menu browser untuk mengunduh.')}
}

/* ===== nobar (PeerJS) ===== */
let peer=null,room=null,supUntil=0,resumeRow=null;
const sup=(ms=400)=>supUntil=Date.now()+ms,muted=()=>Date.now()<supUntil;
const V=()=>cur&&cur.v;
const bc=(m,ex)=>room.conns.forEach(c=>c!==ex&&c.open&&c.send(m));
const emit=m=>{if(!room)return;room.host?bc(m):room.hc&&room.hc.open&&room.hc.send(m)};
const doPlay=()=>{const v=V();if(!v)return;sup();v.play().catch(()=>toast('Tekan play untuk lanjut nonton'))};
const doPause=()=>{const v=V();if(v&&!v.paused){sup();v.pause()}};
const jump=t=>{const v=V();if(v&&isFinite(t)&&Math.abs(v.currentTime-t)>.4){room.rt=t;sup(700);v.currentTime=t}};
function apply(m){
 switch(m.t){
 case'play':room.want=true;jump(m.time);if(!room.hold)doPlay();break;
 case'pause':room.want=false;jump(m.time);doPause();break;
 case'seek':jump(m.time);break;
 case'hold':room.hold=m.v;if(m.v)doPause();else if(room.want)doPlay();break;
 case'sync':room.want=m.playing;if(Math.abs((V()?.currentTime||0)-m.time)>1.5)jump(m.time);if(m.playing&&!room.hold&&V()?.paused)doPlay();if(!m.playing&&V()&&!V().paused)doPause();break;
 case'ep':if(!room.host){const a=catalog.find(x=>x.id===room.film);if(a){room.ep=m.ep;room.pend={time:0,playing:false};room.want=false;location.hash=wl(a,m.ep)}}break;
 case'count':room.n=m.n;showVw();break;
 case'chat':addChat(m);break}
}
function handleBuf(id,b){b?room.bufs.add(id):room.bufs.delete(id);const h=room.bufs.size>0;if(h===room.hold)return;apply({t:'hold',v:h});bc({t:'hold',v:h})}
function setBuf(b){if(!room||b===room.myBuf)return;room.myBuf=b;room.host?handleBuf('host',b):emit({t:'buf',v:b})}
const newRoom=h=>room={host:h,conns:[],bufs:new Set(),hold:false,want:false,myBuf:false,rt:null,log:[],n:1,code:'',hc:null,pend:null,hostPeer:'',joined:false,down:false,poll:null,hb:null};

function showVw(){const e=$('#vw');if(e&&room)e.textContent=room.n+' penonton'}
function showRoomUI(){
 if(!room||!$('#room'))return;$('#room').hidden=false;$('#rcode').textContent=room.code;$('#nb').hidden=true;showVw();renderChat();
 $('#cp').onclick=()=>{const l=location.origin+location.pathname+'#room='+room.code;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Link room disalin'),()=>toast('Kode room: '+room.code))};
 $('#cs').onclick=()=>sendChat();$('#ci').onkeydown=e=>e.key==='Enter'&&sendChat();
 $('#pl').classList.add('rm');const rp=$('#rp'),ri=$('#ri');$('#ctg').onclick=()=>{rp.classList.toggle('on');if(rp.classList.contains('on'))ri.focus()};$('#rs').onclick=()=>sendChat(ri);ri.onkeydown=e=>e.key==='Enter'&&sendChat(ri);
}
function renderChat(){const cm=$('#cm');if(!cm||!room)return;cm.innerHTML='';room.log.forEach(m=>cm.append(chatEl(m)))}
function chatEl(m){const d=document.createElement('div');d.className='msg'+(m.sys?' sys':'');
 if(m.sys)d.textContent=String(m.text).slice(0,120);else{const b=document.createElement('b');b.textContent=String(m.name).slice(0,20);d.append(b,' '+String(m.text).slice(0,300))}return d}
function addChat(m){room.log.unshift(m);if(room.log.length>150)room.log.pop();const cm=$('#cm');if(cm){cm.prepend(chatEl(m));cm.scrollTop=0}floatMsg(m)}
function floatMsg(m){const f=$('#fl');if(!f)return;const d=chatEl(m);d.className='fx'+(m.sys?' sys':'');f.prepend(d);while(f.children.length>6)f.lastChild.remove();setTimeout(()=>d.remove(),9000)}
function sendChat(i=$('#ci')){const text=i.value.trim();if(!text)return;i.value='';const m={t:'chat',name:user(),text};addChat(m);emit(m)}
const sysMsg=text=>{const m={t:'chat',sys:1,text};addChat(m);bc(m)};

const alive=r=>Date.now()-new Date(r.last_seen).getTime()<300000;
const rget=c=>api('rooms?code=eq.'+encodeURIComponent(c)+'&select=*').then(r=>r.json()).then(x=>x[0]);
async function startRoom(a,row){
 if(room)return;newRoom(true);room.film=a.id;room.ep=row?(row.episode||0):((cur&&cur.ep)||0);
 const gen=()=>Math.random().toString(36).slice(2,7).toUpperCase();
 room.code=row?row.code:gen();
 const pid='bioskop-'+room.code+'-'+Math.random().toString(36).slice(2,6);
 try{peer=new Peer(pid)}catch{room=null;return toast('PeerJS gagal dimuat.')}
 peer.on('open',async()=>{
  if(!room||!room.host)return;
  const now=new Date().toISOString();
  try{
   api('rooms?last_seen=lt.'+encodeURIComponent(new Date(Date.now()-300000).toISOString()),{method:'DELETE'}).catch(()=>{});
   if(row){const r=await api('rooms?code=eq.'+row.code,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({host_peer:pid,last_seen:now})});if(!(await r.json()).length)throw 0}
   else{
    await api('rooms?host=eq.'+encodeURIComponent(user()),{method:'DELETE'});
    for(let i=0;;i++){const r=await api('rooms',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code:room.code,film_id:a.id,episode:room.ep,host:user(),host_peer:pid,last_seen:now,pos:0,playing:false})});if(r.ok)break;if(i>=4)throw 0;room.code=gen()}
   }
  }catch{toast('Gagal menyimpan room ke database.');leaveRoom();return}
  showRoomUI();
  addChat({sys:1,text:row?'Room dilanjutkan. Teman akan tersambung kembali otomatis.':'Room siap. Kirim kode atau link ke temanmu.'});
  const v=V();
  if(v){room.want=!v.paused;
   if(row&&row.pos>1){const go=()=>{room.rt=row.pos;V().currentTime=row.pos};v.readyState>=1?go():v.addEventListener('loadedmetadata',go,{once:true})}}
  room.hb=setInterval(heartbeat,10000);
 });
 peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
 peer.on('error',e=>toast('Koneksi gagal: '+e.type));
 peer.on('connection',c=>{
  c.on('open',()=>{if(!room)return;room.conns.push(c);const v=V();c.send({t:'init',film:room.film,ep:room.ep||0,time:v?v.currentTime:0,playing:room.want&&!room.hold});c.send({t:'hold',v:room.hold});cnt()});
  c.on('data',m=>{if(!room)return;if(m.t==='buf')handleBuf(c.peer,m.v);else if(m.t==='hello'){const fresh=!c.nick;c.nick=String(m.name).slice(0,20);if(fresh)sysMsg(c.nick+' bergabung')}else{apply(m);bc(m,c)}});
  const drop=()=>{if(!room||!room.conns.includes(c))return;room.conns=room.conns.filter(x=>x!==c);handleBuf(c.peer,false);if(c.nick)sysMsg(c.nick+' keluar');cnt()};
  c.on('close',drop);c.on('error',drop)});
}
function heartbeat(){
 if(!room||!room.host)return;const v=V();
 api('rooms?code=eq.'+room.code,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({last_seen:new Date().toISOString(),episode:room.ep||0,pos:v?v.currentTime:0,playing:!!room.want})}).catch(()=>{});
}
function cnt(){room.n=room.conns.length+1;showVw();bc({t:'count',n:room.n})}
setInterval(()=>{if(room&&room.host&&room.conns.length&&V())bc({t:'sync',time:V().currentTime,playing:room.want})},4000);

async function resumeHost(){
 if(room||!user())return;
 try{
  const r=await api('rooms?host=eq.'+encodeURIComponent(user())+'&select=*&order=last_seen.desc&limit=1');
  const row=(await r.json())[0];if(!row||!alive(row))return;
  const a=catalog.find(x=>x.id===row.film_id);if(!a)return;
  resumeRow=row;toast('Melanjutkan room '+row.code);
  const h=wl(a,row.episode);if(location.hash===h)render();else location.hash=h;
 }catch{}
}

async function joinRoom(code){
 leaveRoom();let row;
 try{row=await rget(code)}catch{return toast('Gagal terhubung ke database.')}
 if(!row||!alive(row))return toast('Room tidak ditemukan atau sudah berakhir.');
 newRoom(false);room.code=code;room.hostPeer=row.host_peer;
 try{peer=new Peer()}catch{room=null;return toast('PeerJS gagal dimuat.')}
 peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
 peer.on('error',e=>{
  if(!room)return;
  if(e.type==='peer-unavailable'&&room.joined){room.down=true;return}
  toast(e.type==='peer-unavailable'?'Room tidak ditemukan. Cek kodenya.':'Koneksi gagal: '+e.type);leaveRoom()});
 peer.on('open',()=>{if(!room)return;connectHost();room.poll=setInterval(checkRoom,4000)});
}
function connectHost(){
 if(!peer||!room||room.host)return;
 const c=room.hc=peer.connect(room.hostPeer,{reliable:true});
 c.on('open',()=>c.send({t:'hello',name:user()}));
 c.on('data',m=>{
  if(!room)return;
  if(m.t!=='init')return apply(m);
  room.joined=true;room.down=false;room.want=m.playing;room.pend={time:m.time,playing:m.playing};
  const a=catalog.find(x=>x.id===m.film);if(!a){toast('Film room tidak ada di katalogmu.');return leaveRoom()}
  room.film=a.id;room.ep=m.ep||0;if(V()&&cur.a.id===a.id&&(cur.ep||0)===(m.ep||0))bindRoomStart();else location.hash=wl(a,m.ep);
 });
 c.on('close',()=>{if(room&&room.hc===c){room.down=true;room.hold=false;toast('Host terputus. Menunggu host kembali (maks 5 menit)…')}});
}
async function checkRoom(){
 if(!room||room.host)return;const code=room.code;
 try{
  const row=await rget(code);if(!room||room.code!==code)return;
  if(!row||!alive(row)){toast('Room berakhir karena host tidak kembali.');leaveRoom();location.hash='#/';return}
  if(room.down||row.host_peer!==room.hostPeer){room.hostPeer=row.host_peer;room.down=false;connectHost()}
 }catch{}
}
function bindRoomStart(){const v=V();if(!room||!room.pend||!v)return;const p=room.pend;
 const go=()=>{room.pend=null;if(p.time>0){room.rt=p.time;v.currentTime=p.time}if(p.playing&&!room.hold)doPlay();else if(!p.playing)doPause();showRoomUI()};
 v.readyState>=1?go():v.addEventListener('loadedmetadata',go,{once:true})}
function leaveRoom(){if(room){clearInterval(room.poll);clearInterval(room.hb)}if(peer){try{peer.destroy()}catch{}}peer=null;room=null}

/* ===== pemutar ===== */
function player(a,n,ep,nextHref){
 const v=$('#v'),pl=$('#pl'),sk=$('#sk'),vo=$('#vo');cur={a,n,v,ep:ep||0};
 let timer,last=0,rate=0;const rates=[1,1.25,1.5,2,.75];
 const fill=(e,x)=>e.style.setProperty('--v',x+'%');
 const show=()=>{pl.classList.add('ui');clearTimeout(timer);if(!v.paused)timer=setTimeout(()=>pl.classList.remove('ui'),3000)};
 const emitT=t=>room&&!muted()&&emit({t,time:v.currentTime});
 pl.onclick=e=>{if(e.target.closest('button,input,a'))return;pl.classList.contains('ui')&&!v.paused?pl.classList.remove('ui'):show()};
 $('#pp').onclick=()=>v.paused?v.play():v.pause();
 $('#rw').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);show()};
 $('#fw').onclick=()=>{v.currentTime=Math.min(v.duration||0,v.currentTime+10);show()};
 $('#mu').onclick=()=>v.muted=!v.muted;
 vo.oninput=()=>{v.volume=+vo.value;v.muted=v.volume===0;fill(vo,v.volume*100)};
 v.onvolumechange=()=>{$('#mu').innerHTML=ic(v.muted?'mute':'vol')};
 $('#sp').onclick=()=>{rate=(rate+1)%rates.length;v.playbackRate=rates[rate];toast('Kecepatan '+rates[rate]+'x')};
 $('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():pl.requestFullscreen?.();
 sk.oninput=()=>v.currentTime=+sk.value;
 v.onloadedmetadata=()=>{
  sk.max=v.duration;$('#dur').textContent=ft(v.duration);
  if(room&&room.pend)return;
  const h=hist.find(x=>x.id===a.id&&x.ep===(ep||0));if(h&&h.t>5&&h.t<v.duration-5)v.currentTime=h.t};
 v.ontimeupdate=()=>{if(!v.duration)return;sk.value=v.currentTime;fill(sk,v.currentTime/v.duration*100);$('#cur').textContent=ft(v.currentTime);if(Date.now()-last>5000){last=Date.now();saveNow()}};
 v.onwaiting=()=>{$('#buf').classList.add('on');$('#bt').textContent='Memuat…';setBuf(true)};
 v.onplaying=()=>{$('#buf').classList.remove('on');$('#pp').innerHTML=ic('pause',26);show();setBuf(false)};
 v.oncanplay=()=>{$('#buf').classList.remove('on');setBuf(false)};
 v.onplay=()=>{if(room&&!muted()){room.want=true;emitT('play')}};
 v.onpause=()=>{$('#pp').innerHTML=ic('play',26);show();saveNow();if(room&&!muted()&&!v.ended){room.want=false;emitT('pause')}};
 v.onseeked=()=>{if(!room)return;if(room.rt!==null&&Math.abs(v.currentTime-room.rt)<.8){room.rt=null;return}emitT('seek')};
 v.onerror=()=>{$('#buf').classList.add('on');$('#bt').textContent='Video gagal dimuat. Cek URL CDN.'};
 $('#dl').onclick=()=>download(a,n,ep);v.onended=()=>{if(nextHref&&(!room||room.host))location.hash=nextHref};
 $('#nb').onclick=()=>startRoom(a);
 if(room){showRoomUI();if(room.pend)bindRoomStart();else{room.rt=null;const t=hist.find(x=>x.id===a.id);if(!room.host&&room.want)v.play().catch(()=>{})}}
 else if(resumeRow){const r=resumeRow;resumeRow=null;setTimeout(()=>startRoom(a,r),0)}else v.play().catch(()=>{});
 show();
 if(room&&room.host&&room.ep!==(ep||0)){room.ep=ep||0;bc({t:'ep',ep:room.ep})}
}

/* ===== admin: tambah/edit film ===== */
const rowH=(r='720p',u='')=>`<div class="row"><input class="in u" value="${esc(u)}" placeholder="https://cdn-kamu.com/film.mp4"><select class="in r">${RES.map(x=>`<option${x===r?' selected':''}>${x}</option>`).join('')}</select><button class="b2 x">✕</button></div>`;
function filmModal(id){
 const f=catalog.find(x=>x.id===id),d=document.createElement('div');d.className='md';
 d.innerHTML=`<div><h2 style="margin:0">${f?'Edit film':'Tambah film'}</h2><input class="in" id="mt" placeholder="Judul film" value="${esc(f?.title||'')}"><div id="mr" style="display:grid;gap:6px">${f?f.sources.map(s=>rowH(s.res,s.url)).join(''):rowH()}</div><button class="b2" id="ma">+ Resolusi</button><div class="btns" style="margin:6px 0 0"><button class="b2" id="mc">Batal</button><button class="b2 on" id="ms">Simpan</button></div></div>`;
 document.body.append(d);
 $('#ma').onclick=()=>$('#mr').insertAdjacentHTML('beforeend',rowH('1080p'));
 $('#mr').onclick=e=>{if(e.target.classList.contains('x')&&$('#mr').children.length>1)e.target.parentNode.remove()};
 $('#mc').onclick=()=>d.remove();
 $('#ms').onclick=async()=>{
  const title=$('#mt').value.trim();
  const sources=[...d.querySelectorAll('.row')].map(r=>({res:r.querySelector('.r').value,url:r.querySelector('.u').value.trim()})).filter(s=>s.url);
  if(!title||!sources.length)return toast('Isi judul dan minimal satu link.');
  if(sources.some(s=>!/^https:\/\//i.test(s.url)))return toast('Link harus diawali https://');
  try{const r=await api(f?'films?id=eq.'+f.id:'films',{method:f?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,sources})});if(!r.ok)throw 0;
   d.remove();toast('Film disimpan');loadCatalog()}catch{toast('Gagal menyimpan film.')}
 };
}

/* ===== poster otomatis (TMDB) ===== */
const pcache=new Map();
function poster(t,tv){const k='bs:p:'+(tv?'tv:':'')+t.toLowerCase();if(pcache.has(k))return pcache.get(k);const c=ls.get(k,null);
 const pr=c?Promise.resolve(c):tmdbPoster(t,tv).then(u=>{if(u)ls.set(k,u);return u});pcache.set(k,pr);return pr}
function fillPosters(){document.querySelectorAll('img[data-t]').forEach(i=>poster(i.dataset.t,i.dataset.k==='tv').then(u=>{if(u&&i.isConnected)i.src=u}))}
async function tmdbPoster(title,tv){
 const y=(title.match(/\((\d{4})\)/)||[])[1],q=title.replace(/\(.*?\)/g,'').trim();
 const get=async(kind,withY)=>{try{const r=await fetch(`https://api.themoviedb.org/3/search/${kind}?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`+(withY&&y?(kind==='movie'?'&year=':'&first_air_date_year=')+y:''));if(!r.ok)return null;const h=((await r.json()).results||[]).find(x=>x.poster_path);return h?'https://image.tmdb.org/t/p/w500'+h.poster_path:null}catch{return null}};
 return tv?(await get('tv',true)||await get('tv',false)||await get('movie',false)):(await get('movie',true)||await get('movie',false)||await get('tv',false))
}
/* ===== impor film dari file JSON (admin) ===== */
const normRes=r=>{r=String(r||'').trim();const n=parseInt(r.replace(/\D/g,''),10);if(/4k/i.test(r)||n===2160)return'4K';return n?n+'p':'720p'};
function extractFilms(j){
 const arr=Array.isArray(j)?j:Array.isArray(j?.data)?j.data:[j];
 return arr.filter(x=>x&&typeof x==='object').map(x=>{
  const title=String(x.anime?.nama_anime||x.anime_title||'').trim();
  const seen=new Set(),sources=[];
  for(const q of Array.isArray(x.qualities)?x.qualities:[]){const url=String(q?.source_quality||'').trim(),res=normRes(q?.nama_quality);if(/^https:\/\//i.test(url)&&!seen.has(res)){seen.add(res);sources.push({res,url})}}
  return{title,sources}
 }).filter(f=>f.title&&f.sources.length)
}
async function importJson(inp){
 const files=[...inp.files];inp.value='';if(!files.length)return;
 const map=new Map();let bad=0;
 for(const f of files){try{for(const x of extractFilms(JSON.parse(await f.text()))){const k=x.title.toLowerCase(),m=map.get(k);if(!m)map.set(k,x);else{x.sources.forEach(s=>{if(!m.sources.some(y=>y.res===s.res))m.sources.push(s)})}}}catch{bad++}}
 if(!map.size)return toast(bad?'File JSON tidak valid.':'Tidak ada data film yang bisa dibaca.');
  let add=0,upd=0,skip=0,fail=0;
 for(const x of map.values()){
  const ex=catalog.find(c=>c.title.toLowerCase()===x.title.toLowerCase());
  try{
   if(ex){
    const src=[...ex.sources];let ch=false;
    x.sources.forEach(s=>{if(!src.some(y=>y.res===s.res)){src.push(s);ch=true}});
    if(!ch){skip++;continue}
    const r=await api('films?id=eq.'+ex.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({sources:src})});if(!r.ok)throw 0;upd++;
   }else{
    const r=await api('films',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(x)});if(!r.ok)throw 0;add++;
   }
  }catch{fail++}
 }
 toast(`${add} film ditambahkan`+(upd?`, ${upd} diperbarui`:'')+(skip?`, ${skip} sudah ada`:'')+(fail?`, ${fail} gagal`:'')+(bad?`, ${bad} file tidak valid`:''));
 loadCatalog();
}
document.addEventListener('change',e=>{if(e.target.id==='jf'&&isAdmin())importJson(e.target);if(e.target.id==='sf'&&isAdmin())importSeries(e.target)});
async function importSeries(inp){
 const files=[...inp.files];inp.value='';if(!files.length)return;
 const map=new Map();let bad=0;
 for(const f of files){try{
  const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:Array.isArray(j?.data)?j.data:[j];
  for(const x of arr){
   const title=String(x?.anime?.nama_anime||x?.anime_title||'').trim(),no=Number(x?.nomor_episode);
   if(!title||!Number.isFinite(no))continue;
   const th=String(x.thumbnail_episode||'').trim(),srcs=[];
   (Array.isArray(x.qualities)?x.qualities:[]).forEach(q=>{const url=String(q?.source_quality||'').trim();if(/^https:\/\//i.test(url))srcs.push({res:normRes(q.nama_quality),url})});
   if(!srcs.length)continue;
   const k=title.toLowerCase();let s=map.get(k);if(!s)map.set(k,s={title,eps:new Map()});
   let e=s.eps.get(no);if(!e)s.eps.set(no,e={no,title:String(x.judul_episode||'Episode '+no),thumb:/^https:\/\//i.test(th)?th:'',sources:[]});
   srcs.forEach(q=>{if(!e.sources.some(y=>y.res===q.res))e.sources.push(q)});
  }}catch{bad++}}
 if(!map.size)return toast(bad?'File JSON tidak valid.':'Tidak ada data episode yang bisa dibaca.');
 let addS=0,addE=0,updE=0,fail=0;
 for(const s of map.values()){
  const eps=[...s.eps.values()].sort((x,y)=>x.no-y.no),ex=catalog.find(c=>c.title.toLowerCase()===s.title.toLowerCase());
  try{
   if(ex){
    const cu=(ex.episodes||[]).map(e=>({...e,sources:[...e.sources]}));let ch=0;
    for(const e of eps){const o=cu.find(z=>z.no===e.no);
     if(!o){cu.push(e);addE++;ch++}
     else{let c=false;e.sources.forEach(q=>{if(!o.sources.some(y=>y.res===q.res)){o.sources.push(q);c=true}});if(!o.thumb&&e.thumb){o.thumb=e.thumb;c=true}if(c){updE++;ch++}}}
    if(!ch)continue;
    cu.sort((x,y)=>x.no-y.no);
    const r=await api('films?id=eq.'+ex.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({episodes:cu})});if(!r.ok)throw 0;
   }else{
    const r=await api('films',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title:s.title,sources:[],episodes:eps})});if(!r.ok)throw 0;addS++;addE+=eps.length}
  }catch{fail++}}
 toast((addS?addS+' serial baru, ':'')+`${addE} episode ditambahkan`+(updE?`, ${updE} diperbarui`:'')+(fail?`, ${fail} gagal`:'')+(bad?`, ${bad} file tidak valid`:''));
 loadCatalog();
}

async function render(){
 saveNow();cur=null;const app=$('#app');
 if(!user()){leaveRoom();app.innerHTML=loginHtml();bindLogin();return}
 const parts=(location.hash.slice(1)||'/').split('/').filter(Boolean).map(decodeURIComponent);
 if(parts[0]!=='watch'&&room&&!room.pend)leaveRoom();
 if(!parts[0]||['history','watch'].includes(parts[0]))await loadHist();
 const[body,init]=view(parts);
 const on=['film','watch'].includes(parts[0])?'':(parts[0]||'');
 const tabs=[['','home','Beranda'],['explore','compass','Jelajahi'],['history','clock','Riwayat'],['downloads','dl','Unduhan'],['more','menu','Lainnya']];
 app.innerHTML=`<header class="hd"><a href="#/" class="logo">Bioskop <span>Ana</span></a><div style="display:flex;gap:8px"><a href="#/explore" class="ib">${ic('search')}</a><a href="#/more" class="av">${esc(user()[0].toUpperCase())}</a></div></header><main>${body}</main><nav class="nv">${tabs.map(t=>`<a href="#/${t[0]}" class="${on===t[0]?'on':''}">${ic(t[1],24)}${t[2]}</a>`).join('')}</nav>`;
 scrollTo(0,0);if(init)init();fillPosters();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-dl]');if(b){e.preventDefault();const[id,i,ep]=b.dataset.dl.split(':'),a=catalog.find(x=>x.id===id);if(a)download(a,+i,+ep)}
 const ea=e.target.closest('[data-ep]');if(ea&&room&&!room.host){e.preventDefault();toast('Hanya host yang bisa ganti episode.')}
 const ed=e.target.closest('[data-edit]');if(ed&&isAdmin())filmModal(ed.dataset.edit);
 if(e.target.closest('#ij')&&isAdmin())$('#jf').click();
 if(e.target.closest('#is')&&isAdmin())$('#sf').click()
});
addEventListener('hashchange',()=>{const m=location.hash.match(/room=([A-Za-z0-9]+)/);if(m&&user())return joinRoom(m[1].toUpperCase());render()});
addEventListener('pagehide',saveNow);
loadCatalog().then(()=>{const m=location.hash.match(/room=([A-Za-z0-9]+)/);if(m&&user())joinRoom(m[1].toUpperCase());else if(user())resumeHost()});
</script>
