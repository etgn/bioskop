<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bioskop Ana</title>
<script>try{var _u=JSON.parse(localStorage.getItem("bs:s")),_k=JSON.parse(localStorage.getItem("bs:skin:"+_u)||localStorage.getItem("bs:skin")||"null");if(_k==="lucu")document.documentElement.dataset.skin="lucu"}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--mw:100%;--pd:16px;--cw:100px;--bg:#05050a;--cd:#0c0b16;--ln:#201d36;--tx:#f4f3fc;--mu:#9b98b8;--c1:#8b5cf6;--c2:#3b82f6;--c3:#3b82f6;--g:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));--a:color-mix(in srgb,var(--c1) 60%,#fff);--a2:color-mix(in srgb,var(--c1) 38%,#fff);--b:color-mix(in srgb,var(--c2) 60%,#fff);--bd:color-mix(in srgb,var(--c1) 65%,#000);--t1:color-mix(in srgb,var(--c1) 30%,transparent);--t2:color-mix(in srgb,var(--c2) 24%,transparent);--t3:color-mix(in srgb,var(--c1) 15%,transparent)}
html{background:var(--bg)}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:88px;background:radial-gradient(700px 360px at 0 -40px,var(--t1),transparent 70%),radial-gradient(600px 340px at 100% 0,var(--t2),transparent 70%),var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
select option{color:#000}
.hd{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#05050acc;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo.big{font-size:30px;text-align:center}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--mu)}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g);font-weight:700;color:#fff}
main{max-width:var(--mw);margin:auto;padding:var(--pd)}
h2{font-size:17px;margin:26px 0 12px}
h1{letter-spacing:-.02em}
.mu{color:var(--mu)}.mt{margin-top:16px}
.back{display:inline-flex;gap:10px;align-items:center;color:var(--mu);font-weight:600;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:var(--gp,10px)}
.grid>.cd,.cd{display:block;min-width:0}
.cd .po{width:100%}
.po{position:relative;aspect-ratio:2/3;border-radius:22px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,hsl(var(--h) 70% 40%),hsl(calc(var(--h) + 45) 75% 13%));border:1px solid #ffffff14;overflow:hidden}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.po:has(img[src]):after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#05050aee)}
.po b{position:relative;z-index:1;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tg{position:absolute;z-index:2;top:10px;left:10px;padding:2px 10px;border-radius:8px;background:#000a;font:700 11px "JetBrains Mono",monospace;color:var(--a2)}
.cd small{display:block;margin-top:6px;color:var(--mu)}
.list{display:grid;gap:10px}
.hi{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--ln);background:var(--cd);border-radius:18px}
.po.s{width:64px;height:84px;flex:none;border-radius:12px}
.hm{flex:1;min-width:0;display:grid;gap:4px}
.hm b{font-size:14px;line-height:1.3}.hm small{color:var(--mu)}
.pg{height:4px;border-radius:4px;background:#ffffff1a;overflow:hidden}
.pg i{display:block;height:100%;background:var(--g)}
.dt{display:grid;gap:18px}
.dt .po{max-width:200px}
.dt h1{font-size:24px;line-height:1.25;margin-bottom:8px}
@media(min-width:560px){.dt{grid-template-columns:200px 1fr}}
.eps{display:flex;flex-wrap:wrap;gap:10px}
.in{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:#ffffff08;outline:0}
.in:focus{border-color:var(--c1)}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:24px;overflow:hidden;border:1px solid var(--ln)}
.pl:fullscreen{border-radius:0;aspect-ratio:auto}
.pl video{width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute;left:0;right:0;padding:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.ui .ov{opacity:1;pointer-events:auto}
.ov.t{top:0;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(#000c,transparent);padding-bottom:30px}
.ov.t .ib{background:#0008;color:#fff;flex:none}
.tt{display:grid;gap:2px;min-width:0}.tt b{font-size:14px}.tt small{color:#ffffffb3}
.ov.b{bottom:0;padding-top:34px;background:linear-gradient(transparent,#000d)}
.tm{display:flex;align-items:center;gap:10px}
.tm b{font:500 12px "JetBrains Mono",monospace;color:#ffffffcc}
.ct{display:flex;align-items:center;gap:4px;margin-top:2px}
.ct button{display:grid;place-items:center;width:40px;height:40px;color:#fff}
.ct #sp{margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;outline:0;background:linear-gradient(90deg,var(--a),var(--b)) 0 0/var(--v,0%) 100% no-repeat,#ffffff33}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
#vo{flex:none;width:65px}
.buf{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.buf.on{display:grid}
.buf div{padding:9px 16px;border-radius:99px;background:#0b0a14cc;border:1px solid #ffffff1f;font-size:13px}
.info{margin-top:18px;border:1px solid var(--ln);background:var(--cd);border-radius:28px;padding:24px 20px}
.lb{font:700 13px "JetBrains Mono",monospace;letter-spacing:.15em;color:var(--a)}
.info h1{font-size:26px;margin:12px 0}
.eb{display:inline-block;padding:6px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--t3);color:var(--a2);font:700 14px "JetBrains Mono",monospace}
.btns{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.b2{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--ln);border-radius:16px;background:#ffffff08;font-weight:600}
.b2.on{background:var(--g);border-color:transparent;color:#fff}
.b1{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:18px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:#08070ff2;backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.nv a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu)}
.nv a.on{color:var(--a)}
.lg{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.lc{width:min(400px,100%);display:grid;gap:12px;padding:28px 24px;border:1px solid var(--ln);background:#0c0b16e6;border-radius:28px}
.seg{display:flex;padding:4px;border-radius:14px;background:#ffffff0d;margin:4px 0}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg .on{background:var(--g);color:#fff}
.er{min-height:20px;color:#fca5a5;font-size:13px}
#ts{position:fixed;left:50%;bottom:98px;z-index:60;transform:translate(-50%,12px);opacity:0;transition:.2s;pointer-events:none;padding:10px 18px;border-radius:99px;background:#17142b;border:1px solid var(--bd);font-size:13px;text-align:center;max-width:90vw}
#ts.on{opacity:1;transform:translate(-50%,0)}
.status{padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--mu);font-size:13px}
.room{margin-top:14px;border:1px solid var(--ln);background:var(--cd);border-radius:22px;padding:16px}
.rc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc b.code{font:700 20px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--a2)}
.cm{display:flex;flex-direction:column;gap:8px;height:260px;overflow:auto;margin:12px 0}
.msg{word-break:break-word;font-size:14px}.msg b{color:var(--a)}.msg.sys{color:var(--mu);font-size:12px}
.cin{display:flex;gap:8px}
.md{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:16px}
.md>div{width:min(520px,100%);max-height:92vh;overflow:auto;display:grid;gap:10px;background:var(--cd);border:1px solid var(--ln);border-radius:24px;padding:22px}
.row{display:flex;gap:6px}.row .in{padding:10px}.row select{width:100px}
.fl{display:none;position:absolute;right:12px;top:64px;width:min(62%,330px);flex-direction:column;gap:6px;pointer-events:none;z-index:3}
.pl:fullscreen .fl{display:flex}
.fx{align-self:flex-end;max-width:100%;background:#0b0a14bf;backdrop-filter:blur(6px);border:1px solid #ffffff1a;padding:7px 12px;border-radius:14px;font-size:14px;word-break:break-word;animation:fin .3s,fout .6s 8.4s forwards}
.fx b{color:var(--a2)}.fx.sys{color:#ffffffaa;font-size:12px}
@keyframes fin{from{opacity:0;transform:translateX(24px)}}
@keyframes fout{to{opacity:0}}
.rp{display:none;position:absolute;right:12px;bottom:96px;width:min(70%,360px);gap:6px;z-index:4}
.pl:fullscreen .rp.on{display:flex}
.rp .in{padding:10px 14px;background:#0b0a14d9}
#ctg{display:none!important}
.pl.rm:fullscreen #ctg{display:grid!important}
.et{position:relative;width:120px;aspect-ratio:16/10;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 60% 35%),#0c0b16)}
.et img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.et:after{content:"▶";position:absolute;z-index:1;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:#0009;display:grid;place-items:center;font-size:11px;color:#fff;padding-left:2px}
.en{position:absolute;z-index:2;left:6px;bottom:6px;padding:1px 8px;border-radius:7px;background:#000b;font:700 11px "JetBrains Mono",monospace;color:#fff}
.eps .b2.on{border-color:transparent}
/* tampilan serial */
.sh{display:grid;justify-items:center;text-align:center;gap:10px;padding-bottom:6px}
.sh .po{width:170px;aspect-ratio:2/3;box-shadow:0 18px 60px -12px color-mix(in srgb,var(--c1) 67%,transparent)}
.sh h1{font-size:26px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:#ffffff0a;font:600 12px Inter,sans-serif}
.syn{text-align:left;width:100%;border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:16px}
.syn h3{font-size:14px;margin-bottom:6px}.syn p{color:var(--mu);font-size:14px;line-height:1.6}
.sh .b1{max-width:420px}
.pcard{margin-top:14px;border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:14px 16px;display:grid;gap:8px}
.pcard small{color:var(--mu)}
.rr{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.rr .cd{width:128px;flex:none}
.tb{display:flex;gap:8px}
.du{position:absolute;z-index:2;right:6px;bottom:6px;padding:1px 8px;border-radius:7px;background:#000b;font:700 11px "JetBrains Mono",monospace;color:#fff}
.du:empty{display:none}
.hi .ib[data-dl]{background:var(--t3);color:var(--a);border-radius:12px;flex:none}
/* tema + form edit */
.cps{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
.cl{display:grid;justify-items:center;gap:6px;color:var(--mu);font-size:12px}
input[type=color]{-webkit-appearance:none;appearance:none;width:64px;height:64px;padding:0;border:2px solid var(--ln);border-radius:18px;background:none;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0}
.pvb{height:14px;border-radius:99px;background:var(--g)}
.xl,.xs{display:grid;gap:8px}
.xs{gap:6px}
.xe{border:1px solid var(--ln);border-radius:14px;background:#ffffff06}
.xe summary{padding:12px 14px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.xe summary::-webkit-details-marker{display:none}
.xe summary span{color:var(--mu);font-weight:400;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xe[open] summary{border-bottom:1px solid var(--ln)}
.xb{display:grid;gap:8px;padding:12px}
.btns.mb{position:sticky;z-index:5;bottom:0;margin:6px -22px -22px;padding:12px 22px 22px;background:var(--cd);border-top:1px solid var(--ln)}
/* kartu gaya baru */
.cd .po{padding:10px;border-radius:20px}
.cd .po b{-webkit-line-clamp:2;font-size:14px;text-shadow:0 1px 8px #000b}
.sub{position:relative;z-index:1;margin-top:3px;font-size:11px;color:#ffffffb8}
.rt{position:absolute;z-index:2;top:0;right:0;display:flex;align-items:center;gap:4px;padding:5px 10px 6px 12px;border-radius:0 0 0 14px;background:#0b0a14d9;font:700 12px Inter,sans-serif;color:#fff}
.rt:before{content:"★";color:#fbbf24}
.rt[hidden]{display:none}
/* panel admin + tema simpel */

.ur{flex-direction:column;align-items:stretch;gap:10px}
.uh{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#4b4966;margin-top:6px}
.dot.on{background:#34d399;box-shadow:0 0 0 4px #34d39926}
.ura{display:flex;gap:8px;flex-wrap:wrap}
.ura .b2{padding:8px 12px;font-size:13px;color:#fca5a5}
.bdg{display:inline-block;padding:1px 8px;border-radius:99px;background:#ef444426;color:#fca5a5;font:600 11px Inter,sans-serif;margin-left:4px}
.hm small{overflow-wrap:anywhere}
#thc input[type=color]{width:52px;height:52px;border-radius:50%}
.cb{width:52px;height:52px;border-radius:50%;border:1px dashed #ffffff40;display:grid;place-items:center;color:var(--mu);font-size:22px;line-height:1}
.pr{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln)}
/* kategori */
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.cats .b2{padding:8px 16px;white-space:nowrap;font-size:14px}
/* avatar, nobar, suara, soundboard */
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.avg button{aspect-ratio:1;border-radius:50%;font-size:28px;display:grid;place-items:center;border:2px solid transparent}
.avg button.on{border-color:var(--a);transform:scale(1.08)}
.uw{position:relative;flex:none;margin:6px}
.uw .av{width:40px;height:40px;font-size:18px}
.uw .dot{position:absolute;right:-1px;bottom:-1px;margin:0;border:2px solid var(--cd)}
.ct .rv{display:none}
.pl.rm .ct .rv{display:grid}
.ct .act{color:var(--a);background:var(--t1);border-radius:12px}
@media(max-width:480px){.pl.rm:not(:fullscreen):not(.pfs) #vo{display:none}}
body{overflow-x:clip}
/* bingkai avatar (SVG, digenerate lewat JS) */
.av[class*=" bd"]{position:relative;overflow:visible}
.av[class*=" bd"]::after{content:"";position:absolute;inset:-22%;background-position:center;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none;z-index:3}
.bg5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bcell{display:grid;place-items:center;padding:16px 0;border:2px solid transparent;border-radius:14px}
.bcell.on{border-color:var(--a);background:var(--t3)}
.bcell .av{width:42px;height:42px;font-size:19px}
.av.sm{width:30px;height:30px;font-size:14px;flex:none;margin:8px 0 0 8px}
.fx .av.sm{width:24px;height:24px;font-size:12px;margin:7px 0 0 7px}
.cu{display:flex;gap:11px;align-items:flex-start}
.cu>div:last-child{min-width:0}
/* mode sinematik */
.plw{position:relative}
.amb{position:absolute;left:-6%;top:-10%;width:112%;height:120%;filter:blur(36px) saturate(1.9) brightness(1.1);opacity:.75;z-index:0;pointer-events:none;transition:opacity .5s}
.amb.off{opacity:0}
.plw .pl{position:relative;z-index:1}
@media(max-width:420px){.ct button{width:34px}#vo{width:48px}}
/* mini player */
#mini{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;width:min(280px,66vw);background:var(--cd);border:1px solid var(--ln);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #000a;animation:mup .25s}
#mini .mv{aspect-ratio:16/9;background:#000;cursor:pointer}
#mini video{width:100%;height:100%;object-fit:contain;display:block}
#mini .mb{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 12px}
#mini .mtt{flex:1;min-width:0;display:grid}
#mini .mtt b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mtt small{font-size:11px;color:var(--mu)}
#mini button{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--tx)}
#mini #mxx{color:#fca5a5}
@keyframes mup{from{opacity:0;transform:translateY(16px)}}
/* ===== RESPONSIF: HP -> tablet -> laptop -> PC ===== */
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html,body{touch-action:pan-y pinch-zoom}
body{max-width:100%;overflow-x:hidden;overflow-x:clip}
.rr,.cats,.pl,.ct,input,textarea,select{touch-action:auto}
#ts{max-width:calc(100% - 24px)}
#mini{max-width:calc(100% - 24px)}
.hd{padding-top:calc(12px + env(safe-area-inset-top));padding-inline:max(var(--pd),calc((100% - var(--mw))/2 + var(--pd)))}
.cd .po b{font-size:clamp(12px,3.3vw,14px);overflow-wrap:anywhere;word-break:break-word}
.po{min-width:0}
.cd .po,.hi .po{transition:transform .2s,box-shadow .2s}
@media(hover:hover){.cd:hover .po{transform:translateY(-4px);box-shadow:0 14px 30px -10px color-mix(in srgb,var(--c1) 60%,transparent)}.nv a:hover{color:var(--tx)}.hi:hover{border-color:var(--bd)}}
a:focus-visible,button:focus-visible,.in:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.cats{scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.md>div{max-height:92vh;max-height:92dvh}
#ts{bottom:calc(98px + env(safe-area-inset-bottom))}
.rr{scroll-snap-type:x proximity}.rr .cd{scroll-snap-align:start}

/* HP kecil (<360px) */
@media(max-width:359px){main{--pd:12px}.hd{padding-inline:12px}}

/* Landscape HP */
@media(max-height:500px) and (orientation:landscape) and (max-width:1023px){
 .nv{padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .nv a{flex-direction:row;justify-content:center;gap:6px;font-size:12px}
 body{padding-bottom:52px}
 .hd{padding-top:6px;padding-bottom:6px}
 .plw{max-width:calc((100vh - 120px)*16/9);margin-inline:auto}
 #ts{bottom:60px}#mini{bottom:60px}
}

/* TABLET (>=600px) */
@media(min-width:600px){
 :root{--mw:940px;--pd:24px;--cw:138px;--gp:16px}
 body{font-size:16px}
 h2{font-size:19px;margin:30px 0 14px}
 .cd .po b{font-size:14px}
 .list{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
 .et{width:140px}
 .info{padding:28px 26px}
 .plw{max-width:calc((100vh - 150px)*16/9);margin-inline:auto}
 .md>div{padding:26px}
 .lc{padding:34px 30px}
 .rr .cd{width:150px}
 .cats .b2{font-size:15px}
}
@media(min-width:760px){
 .sh{grid-template-columns:210px minmax(0,1fr);justify-items:stretch;text-align:left;column-gap:32px;row-gap:12px;align-content:start;align-items:start}
 .sh .po{grid-column:1;grid-row:1/span 6;width:100%}
 .sh>:not(.po){grid-column:2}
 .sh h1{font-size:30px;margin-top:0}
 .sh .chips{justify-content:flex-start}
 .sh .b1{max-width:340px;justify-self:start}
}

/* LAPTOP (>=1024px): bottom bar -> sidebar kiri */
@media(min-width:1024px){
 :root{--mw:1120px;--pd:32px;--cw:158px;--sb:88px}
 body:has(.nv){padding-left:var(--sb);padding-bottom:32px}
 .nv{top:0;right:auto;width:var(--sb);flex-direction:column;justify-content:flex-start;gap:6px;padding:22px 8px;border-top:0;border-right:1px solid var(--ln);overflow-y:auto}
 .nv a{flex:none;padding:12px 4px;border-radius:14px;font-size:11px}
 .nv a.on{background:var(--t3)}
 #ts{bottom:28px;left:calc(50% + var(--sb)/2)}
 #mini{bottom:24px;width:320px}
 .hd{padding-top:14px;padding-bottom:14px}
 .logo{font-size:24px}
 h2{font-size:21px}
 .md>div{width:min(560px,100%)}
 .sh{grid-template-columns:240px minmax(0,1fr)}
 .info{padding:24px}
 .eps{gap:10px}
}

/* LAPTOP BESAR / PC (>=1280px): sidebar lebar + pemutar di kiri, info di kanan */
@media(min-width:1280px){
 :root{--mw:1360px;--cw:172px;--sb:232px;--gp:18px}
 .nv{padding:26px 14px}
 .nv a{flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 16px;font-size:15px;font-weight:600}
 .list{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
 main:has(.plw){display:grid;grid-template-columns:minmax(0,1fr) 370px;column-gap:26px;align-items:start}
 main:has(.plw)>.back{grid-column:1/-1}
 main:has(.plw)>.plw{grid-column:1;grid-row:2;max-width:none;margin:0}
 main:has(.plw)>.info{grid-column:2;grid-row:2;margin-top:0;max-height:calc(100vh - 150px);overflow:auto;padding:20px}
 main:has(.plw)>.info h1{font-size:21px}
 .eps[style*="max-height"]{max-height:210px!important}
 .sh{grid-template-columns:260px minmax(0,1fr)}
 .po{border-radius:20px}
}

/* LAYAR GEDE (>=1700px) */
@media(min-width:1700px){
 :root{--mw:1680px;--cw:196px;--pd:40px;--gp:22px}
 body{font-size:17px}
 .cd .po b{font-size:16px}
 main:has(.plw){grid-template-columns:minmax(0,1fr) 440px}
 .sh{grid-template-columns:300px minmax(0,1fr)}
 .sh h1{font-size:36px}
}
@media(min-width:2200px){:root{--mw:2000px;--cw:230px}}

async function auth(m,u,p){
 u=u.trim();
 if(!/^[\w.]{3,20}$/.test(u))return'Username 3–20 karakter: huruf, angka, titik, atau garis bawah.';
 if(p.length<6)return'Kata sandi minimal 6 karakter.';

  if(m==='reg')return'Username sudah dipakai.';
  const ah=await hash(p);let ok=false;
  try{ok=(await rpc('admin_ok',{h:ah}))===true}catch{return'Gagal terhubung ke database.'}
  if(!ok)return'Username atau kata sandi salah.';
  const tk=await startSession(ADMIN_USER,ah);if(!tk)return'Gagal membuat sesi. Coba lagi.';
  ls.set('bs:at',ah);ls.set('bs:tk',tk);ls.set('bs:s',ADMIN_USER);loadTheme();loadProfile();await render();return afterLogin()
 }
 try{const ac=await rpc('check_access',{u});if(ac&&ac.banned)return'Akun atau IP kamu diblokir.'+(ac.reason?' Alasan: '+ac.reason:'')}catch{}
 const h=await hash(p);
 try{
  const ok=await rpc(m==='reg'?'register_user':'login_user',{u,h});
  if(ok!==true)return m==='reg'?'Username sudah dipakai.':'Username atau kata sandi salah.';
 }catch{return'Gagal terhubung ke database.'}
 const tk=await startSession(u.toLowerCase(),h);if(!tk)return'Gagal membuat sesi. Coba lagi.';
 ls.set('bs:tk',tk);ls.set('bs:s',u.toLowerCase());loadTheme();loadProfile();await render();afterLogin()
}

/* durasi episode: diambil dari metadata video (2 sekaligus), disimpan di cache */
const dq=[];let dbusy=0;
const setDur=(el,d)=>{if(el.isConnected)el.textContent=Math.max(1,Math.round(d/60))+'m'};
function probe(el,url){
 const k='bs:dur:'+url,c=ls.get(k,0);if(c)return setDur(el,c);
 dq.push({el,url,k});pump()
}
function pump(){
 if(dbusy>=2||!dq.length)return;dbusy++;
 const j=dq.shift(),v=document.createElement('video');let done=0;
 v.preload='metadata';
 const end=()=>{if(done)return;done=1;clearTimeout(t);v.onloadedmetadata=v.onerror=null;v.removeAttribute('src');dbusy--;pump()};
 const t=setTimeout(end,15000);
 v.onloadedmetadata=()=>{if(isFinite(v.duration)){ls.set(j.k,v.duration);setDur(j.el,v.duration)}end()};
 v.onerror=end;v.src=j.url
}

}

function getSkin(){const u=user();return(ls.get(u?'bs:skin:'+u:'bs:skin',null)??ls.get('bs:skin','gelap'))==='lucu'?'lucu':'gelap'}
function setSkin(k){const u=user();k=k==='lucu'?'lucu':'gelap';document.documentElement.dataset.skin=k;ls.set('bs:skin',k);if(u)ls.set('bs:skin:'+u,k);applyTheme(TH);toast(k==='lucu'?'Tema Lucu aktif 🐱':'Tema Gelap aktif')}
const SFX=(()=>{
 let ctx,last=0;const KEY='bs:sfx',N=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
 const enabled=()=>{const v=ls.get(KEY,null);return v===null?document.documentElement.dataset.skin==='lucu':!!v};
 const get=()=>{try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C()}if(ctx.state==='suspended')ctx.resume();return ctx}catch{return null}};
 const tone=(c,f0,f1,t,d,vol,type='sine')=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+d*.6);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)};
 const play=k=>{const c=get();if(!c)return;const t=c.currentTime+.005;
  if(k==='nav'){tone(c,659.25,880,t,.14,.13);tone(c,987.77,1318.5,t+.09,.18,.12)}
  else if(k==='yay')[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(c,f,f*1.02,t+i*.07,.22,.12,'triangle'));
  else{const f=N[Math.random()*N.length|0];tone(c,f*.7,f,t,.16,.15);tone(c,f*2,f*2,t+.02,.1,.04,'triangle')}};
 return{enabled,play,set:v=>ls.set(KEY,!!v),gate:()=>{const n=performance.now();if(n-last<70)return false;last=n;return true}}
})();
const FXE=['💖','🐾','⭐','✨','🍿','🌸'];
function burst(x,y){const e=document.createElement('span');e.className='fxp';e.textContent=FXE[Math.random()*FXE.length|0];e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.round((Math.random()-.5)*60)}px;--r:${Math.round((Math.random()-.5)*50)}deg`;document.body.append(e);setTimeout(()=>e.remove(),900)}
document.addEventListener('click',e=>{const el=e.target;if(!(el instanceof Element)||el.closest('input[type=range],input[type=color],[data-nosfx]')||!SFX.gate())return;
 if(SFX.enabled())SFX.play(el.closest('.nv a')?'nav':el.closest('.b1,[type=submit]')?'yay':'pop');

let MYREQ=[],REQ=[];
const nrm=t=>String(t).toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const inCatalog=t=>catalog.find(a=>nrm(a.title)===nrm(t));
const guessCat=x=>{const an=(x.genre_ids||[]).includes(16);return an&&x.original_language==='ja'?'anime':an&&/^(zh|cn)$/.test(x.original_language||'')?'donghua':'film'};
const stTxt={pending:'Menunggu',done:'Sudah ditambahkan',rejected:'Ditolak'};
async function reqSearch(q){
 const d=await tfetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=id-ID&include_adult=false&query=${encodeURIComponent(q)}`);
 return(d.results||[]).filter(x=>(x.media_type==='movie'||x.media_type==='tv')&&x.poster_path).slice(0,14)
}
async function sendReq(o){
 if(MYREQ.filter(x=>x.status==='pending').length>=5)return toast('Maksimal 5 request yang masih menunggu.');
 try{
  const r=await api('requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({username:user(),...o})});
  if(r.status===409)return toast('Kamu sudah pernah request judul ini.');
  if(!r.ok)throw 0;toast('Request terkirim');loadMyReq()
 }catch{toast('Gagal mengirim request.')}
}
function reqModal(o){

 d.innerHTML=`<div><h2 style="margin:0">Kirim request</h2>${o.poster?`<div class="hi"><div class="po s" style="--h:200"><img src="${esc(o.poster)}" alt=""></div><div class="hm"><b>${esc(o.title)}</b><small>${esc(o.year||'')}</small></div></div>`:`<input class="in" id="qt" placeholder="Judul (mis. Naruto Shippuden)" maxlength="120" value="${esc(o.title||'')}">`}<p class="mu" style="font-size:13px;margin-bottom:-4px">Kategori</p><div class="seg" id="qcat">${CATS.map(c=>`<button type="button" data-v="${c[0]}" class="${cat===c[0]?'on':''}">${c[1]}</button>`).join('')}</div><input class="in" id="qn" placeholder="Catatan (opsional, mis. season atau tahun)" maxlength="200"><div class="btns" style="margin:4px 0 0"><button class="b2" id="qx">Batal</button><button class="b2 on" id="qg">Kirim</button></div></div>`;

/* ===== poster + rating otomatis (TMDB): antrean, ulang saat gagal, cache ===== */
const tq=[];let tb=0;
const tfetch=url=>new Promise((res,rej)=>{tq.push({url,res,rej});tpump()});
function tpump(){
 if(tb>=4||!tq.length)return;tb++;const j=tq.shift();
 const wait=ms=>new Promise(z=>setTimeout(z,ms));
 const run=async n=>{
  try{
   const r=await fetch(j.url);
   if(r.status===404)return j.res({});
   if(r.status===429&&n<3){await wait(900*(n+1));return run(n+1)}
   if(!r.ok)throw 0;
   j.res(await r.json())
  }catch{if(n<2){await wait(600);return run(n+1)}j.rej(new Error('tmdb'))}
 };
 run(0).finally(()=>{tb--;tpump()})
}
async function tmdbFind(a){
 const y=(a.title.match(/\((\d{4})\)/)||[])[1],
  t=a.title.replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim(),
  sm=t.match(/\b(?:season|musim)\s*(\d{1,2})\b/i),season=sm?+sm[1]:0,
  base=t.replace(/[\s\-–:]*\b(?:season|musim)\s*\d{1,2}\b/ig,'').replace(/\blive[\s-]?action\b/ig,'').replace(/[\s\-–:]+$/,'').replace(/\s+/g,' ').trim(),
  qs=[...new Set([t,base,base.split(/\s*[:\-–]\s*/)[0].trim()].filter(q=>q&&q.length>1))],
  kinds=isS(a)||season?['tv','movie']:['movie','tv'],T='https://api.themoviedb.org/3/';
 for(const q of qs)for(const kind of kinds){
  for(const withY of(y&&q===qs[0])?[true,false]:[false]){
   const d=await tfetch(`${T}search/${kind}?api_key=${TMDB_KEY}&language=id-ID&query=${encodeURIComponent(q)}`+(withY?(kind==='movie'?'&year=':'&first_air_date_year=')+y:''));
   const h=(d.results||[]).find(x=>x.poster_path);if(!h)continue;
   let p=h.poster_path;
   if(kind==='tv'&&season){try{const sd=await tfetch(`${T}tv/${h.id}/season/${season}?api_key=${TMDB_KEY}&language=id-ID`);if(sd.poster_path)p=sd.poster_path}catch{}}
   return{p:'https://image.tmdb.org/t/p/w500'+p,r:h.vote_average||0,y:(h.first_air_date||h.release_date||'').slice(0,4),o:h.overview||'',id:h.id,k:kind,g:h.genre_ids||[]}
  }
 }
 return null
}
const mc=new Map();
function meta(a){
 const kk='bs:t2:'+(isS(a)?'s:':'m:')+a.title.toLowerCase();
 if(mc.has(kk))return mc.get(kk);
 const c=ls.get(kk,null);
 const pr=c&&c.p?Promise.resolve(c):c&&c.n&&Date.now()-c.n<6048e5?Promise.resolve(null)
  :tmdbFind(a).then(m=>{ls.set(kk,m||{n:Date.now()});return m}).catch(()=>{mc.delete(kk);return null});
 mc.set(kk,pr);return pr
}
function paint(i){
 const a=catalog.find(x=>x.id===i.dataset.id);if(!a)return;
 meta(a).then(m=>{
  if(!i.isConnected)return;
  if(m&&m.p)i.src=m.p;
  else{const e=isS(a)&&a.episodes.find(z=>z.thumb);if(e)i.src=e.thumb}
  const r=i.parentNode.querySelector('.rt');if(r&&m&&m.r>0){r.textContent=m.r.toFixed(1);r.hidden=false}
 })
}
let io;
function fillPosters(){

 if(io)io.disconnect();
 if(!('IntersectionObserver' in window)){L.forEach(paint);return}
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);paint(e.target)}}),{rootMargin:'500px'});

/* ===== impor film dari file JSON (admin) ===== */
const impCat=d=>(($('#ic')||{}).value)||d;
const normRes=r=>{r=String(r||'').trim();const n=parseInt(r.replace(/\D/g,''),10);if(/4k/i.test(r)||n===2160)return'4K';return n?n+'p':'720p'};
function extractFilms(j){
 const arr=Array.isArray(j)?j:Array.isArray(j?.data)?j.data:[j];
 return arr.filter(x=>x&&typeof x==='object').map(x=>{
  const title=String(x.anime?.nama_anime||x.anime_title||'').trim();
  const seen=new Set(),sources=[];
  for(const q of Array.isArray(x.qualities)?x.qualities:[]){const url=String(q?.source_quality||'').trim(),res=normRes(q?.nama_quality);if(/^https:\/\//i.test(url)&&!seen.has(res)){seen.add(res);sources.push({res,url})}}
  return{title,sources}
 }).filter(f=>f.title&&f.sources.length)
}
async function importJson(inp){
 const files=[...inp.files];inp.value='';if(!files.length)return;
 const map=new Map();let bad=0;
 for(const f of files){try{for(const x of extractFilms(JSON.parse(await f.text()))){const k=x.title.toLowerCase(),m=map.get(k);if(!m)map.set(k,x);else{x.sources.forEach(s=>{if(!m.sources.some(y=>y.res===s.res))m.sources.push(s)})}}}catch{bad++}}
 if(!map.size)return toast(bad?'File JSON tidak valid.':'Tidak ada data film yang bisa dibaca.');
  let add=0,upd=0,skip=0,fail=0;
 for(const x of map.values()){
  const ex=catalog.find(c=>c.title.toLowerCase()===x.title.toLowerCase());
  try{
   if(ex){
    const src=[...ex.sources];let ch=false;
    x.sources.forEach(s=>{if(!src.some(y=>y.res===s.res)){src.push(s);ch=true}});
    if(!ch){skip++;continue}
    if(!await arpc('admin_film_save',{fid:ex.id,d:{sources:src}}))throw 0;upd++;
   }else{
    if(!await arpc('admin_film_save',{fid:null,d:{...x,category:impCat('film')}}))throw 0;add++;
   }
  }catch{fail++}
 }
 toast(`${add} film ditambahkan`+(upd?`, ${upd} diperbarui`:'')+(skip?`, ${skip} sudah ada`:'')+(fail?`, ${fail} gagal`:'')+(bad?`, ${bad} file tidak valid`:''));
 loadCatalog();
}
document.addEventListener('change',e=>{if(e.target.id==='jf'&&isAdmin())importJson(e.target);if(e.target.id==='sf'&&isAdmin())importSeries(e.target)});
async function importSeries(inp){
 const files=[...inp.files];inp.value='';if(!files.length)return;
 const map=new Map();let bad=0;
 for(const f of files){try{
  const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:Array.isArray(j?.data)?j.data:[j];
  for(const x of arr){
   const title=String(x?.anime?.nama_anime||x?.anime_title||'').trim(),no=Number(x?.nomor_episode);
   if(!title||!Number.isFinite(no))continue;
   const th=String(x.thumbnail_episode||'').trim(),srcs=[];
   (Array.isArray(x.qualities)?x.qualities:[]).forEach(q=>{const url=String(q?.source_quality||'').trim();if(/^https:\/\//i.test(url))srcs.push({res:normRes(q.nama_quality),url})});
   if(!srcs.length)continue;
   const k=title.toLowerCase();let s=map.get(k);if(!s)map.set(k,s={title,eps:new Map()});
   let e=s.eps.get(no);if(!e)s.eps.set(no,e={no,title:String(x.judul_episode||'Episode '+no),thumb:/^https:\/\//i.test(th)?th:'',sources:[]});
   srcs.forEach(q=>{if(!e.sources.some(y=>y.res===q.res))e.sources.push(q)});
  }}catch{bad++}}
 if(!map.size)return toast(bad?'File JSON tidak valid.':'Tidak ada data episode yang bisa dibaca.');
 let addS=0,addE=0,updE=0,fail=0;
 for(const s of map.values()){
  const eps=[...s.eps.values()].sort((x,y)=>x.no-y.no),ex=catalog.find(c=>c.title.toLowerCase()===s.title.toLowerCase());
  try{
   if(ex){
    const cu=(ex.episodes||[]).map(e=>({...e,sources:[...e.sources]}));let ch=0;
    for(const e of eps){const o=cu.find(z=>z.no===e.no);
     if(!o){cu.push(e);addE++;ch++}
     else{let c=false;e.sources.forEach(q=>{if(!o.sources.some(y=>y.res===q.res)){o.sources.push(q);c=true}});if(!o.thumb&&e.thumb){o.thumb=e.thumb;c=true}if(c){updE++;ch++}}}
    if(!ch)continue;
    cu.sort((x,y)=>x.no-y.no);
    if(!await arpc('admin_film_save',{fid:ex.id,d:{episodes:cu}}))throw 0;
   }else{
    if(!await arpc('admin_film_save',{fid:null,d:{title:s.title,sources:[],episodes:eps,category:impCat('anime')}}))throw 0;addS++;addE+=eps.length}
  }catch{fail++}}
 toast((addS?addS+' serial baru, ':'')+`${addE} episode ditambahkan`+(updE?`, ${updE} diperbarui`:'')+(fail?`, ${fail} gagal`:'')+(bad?`, ${bad} file tidak valid`:''));
 loadCatalog();
}

/* ===== kategori (genre) dari TMDB ===== */
const GM={28:'Aksi',12:'Petualangan',16:'Animasi',35:'Komedi',80:'Kriminal',99:'Dokumenter',18:'Drama',10751:'Keluarga',14:'Fantasi',36:'Sejarah',27:'Horor',10402:'Musik',9648:'Misteri',10749:'Romantis',878:'Fiksi Ilmiah',10770:'Film TV',53:'Tegang',10752:'Perang',37:'Barat'};
const GTV={10759:['Aksi','Petualangan'],10762:['Anak-anak'],10763:['Berita'],10764:['Reality'],10765:['Fiksi Ilmiah','Fantasi'],10766:['Sinetron'],10767:['Talk Show'],10768:['Perang']};
const gNames=ids=>[...new Set(ids.flatMap(i=>GTV[i]||(GM[i]?[GM[i]]:[])))];
/* undefined = gagal terhubung (dicoba lagi nanti), [] = tidak ada kategori di TMDB */
async function genresOf(a,force){
 const kk='bs:g3:'+(isS(a)?'s:':'m:')+a.title.toLowerCase();
 if(!force){const c=ls.get(kk,null);if(c&&Array.isArray(c.g)&&Date.now()-c.t<6048e5)return c.g}
 try{const m=await tmdbFind(a),g=m?gNames(m.g||[]):[];ls.set(kk,{g,t:Date.now()});return g}catch{return undefined}
}
async function runGenres(L,force){
 if(GB||!L.length)return 0;
 GB=1;GP={n:0,t:L.length};let ok=0,bad=0,persist=isAdmin();
 const one=async a=>{
  if(bad>=6)return;
  const g=await genresOf(a,force);
  if(g===undefined){bad++;return}
  GP.n++;
  if(force&&!g.length)return;
  if(persist){const r=await arpc('admin_film_save',{fid:a.id,d:{genres:g}});if(r)ok++;else persist=false}
  a.genres=g;if(!force)ok++
 };
 try{
  for(let i=0;i<L.length&&bad<6;i+=4){await Promise.all(L.slice(i,i+4).map(one));gRefresh()}
 }finally{GB=0;GP=null;if(bad>=6)GT=Date.now();gRefresh(1)}
 return ok
}
function ensureGenres(){
 if(GB||!user()||Date.now()-GT<6e4)return;
 const L=catalog.filter(a=>a.genres==null);if(L.length)runGenres(L,false)
}
